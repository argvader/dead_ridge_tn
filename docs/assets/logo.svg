<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Dead Ridge, TN">
  <!-- Dead Ridge mark: a bone ridgeline under ink spray, set in an oxblood plate.
       The plate is opaque on purpose — the same file is the favicon, so the mark
       has to hold up on the red header, the black night header, and a browser tab
       bar of any color. Hard square edges echo the ruled red boxes in the book. -->
  <rect width="48" height="48" fill="#8b1d18"/>
  <rect x="3.5" y="3.5" width="41" height="41" fill="none" stroke="#d8ceba" stroke-width="1" opacity="0.55"/>

  <g fill="#d8ceba">
    <!-- Ridgeline. -->
    <path d="M6 42 L6 31 L11.5 23.5 L15.5 28 L21 18 L26.5 27 L31.5 21.5 L37 28.5 L42 24 L42 42 Z"/>
    <!-- Ink spray above the ridge. -->
    <circle cx="34.5" cy="12" r="2.1"/>
    <circle cx="39.5" cy="16.5" r="1.1"/>
    <circle cx="29.5" cy="9.5" r="0.8"/>
    <circle cx="13" cy="14" r="1.4"/>
    <circle cx="18.5" cy="10.5" r="0.7"/>
  </g>
</svg>
